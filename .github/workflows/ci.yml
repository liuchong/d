name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Architecture Check
        run: |
          cargo xtask check
          cargo xtask info

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p d --no-default-features --all-targets -- -D warnings
          cargo clippy -p d-minimal --features mcp --all-targets -- -D warnings

      - name: Test
        run: |
          cargo test --workspace
          cargo test -p d-minimal --features mcp

  acceptance:
    name: end-to-end acceptance
    strategy:
      matrix:
        # acceptance.sh is bash + curl + ln -s; run on unix-like runners.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Acceptance
        run: scripts/acceptance.sh

  audit:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
