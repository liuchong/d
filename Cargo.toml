[workspace]
resolver = "2"
members = [
    "crates/frame",
    "crates/contracts/net-api",
    "crates/contracts/tls-api",
    "crates/contracts/http-api",
    "crates/contracts/ws-api",
    "crates/contracts/proxy-api",
    "crates/contracts/files-api",
    "crates/contracts/render-api",
    "crates/components/l4-transport",
    "crates/components/l4-tls",
    "crates/components/proto-http",
    "crates/components/proto-ws",
    "crates/components/proto-tcp",
    "crates/components/ext-proxy",
    "crates/components/ext-observability",
    "crates/components/ext-ratelimit",
    "crates/components/ext-auth",
    "crates/components/ext-dev-kit",
    "crates/components/ext-compression",
    "crates/components/ext-cors",
    "crates/components/app-files",
    "crates/components/doc-render",
    "crates/components/doc-render-plain",
    "crates/components/viewer-markdown",
    "crates/components/viewer-code",
    "crates/components/viewer-media",
    "crates/entries/cli",
    "crates/entries/daemon",
    "crates/entries/mcp",
    "crates/assemblies/d",
    "crates/assemblies/d-minimal",
    "xtask",
]
default-members = [
    "crates/frame",
    "crates/contracts/net-api",
    "crates/contracts/tls-api",
    "crates/contracts/http-api",
    "crates/contracts/ws-api",
    "crates/contracts/proxy-api",
    "crates/contracts/files-api",
    "crates/contracts/render-api",
    "crates/components/l4-transport",
    "crates/components/l4-tls",
    "crates/components/proto-http",
    "crates/components/proto-ws",
    "crates/components/proto-tcp",
    "crates/components/ext-proxy",
    "crates/components/ext-observability",
    "crates/components/ext-ratelimit",
    "crates/components/ext-auth",
    "crates/components/ext-dev-kit",
    "crates/components/ext-compression",
    "crates/components/ext-cors",
    "crates/components/app-files",
    "crates/components/doc-render",
    "crates/components/doc-render-plain",
    "crates/components/viewer-markdown",
    "crates/components/viewer-code",
    "crates/components/viewer-media",
    "crates/entries/cli",
    "crates/entries/daemon",
    "crates/entries/mcp",
    "crates/assemblies/d",
]

[workspace.metadata.architecture]
kernel = ["frame"]
contracts = ["net-api", "tls-api", "http-api", "ws-api", "proxy-api", "files-api", "render-api"]
components = [
    "l4-transport",
    "l4-tls",
    "proto-http",
    "proto-ws",
    "proto-tcp",
    "ext-proxy",
    "ext-observability",
    "ext-ratelimit",
    "ext-auth",
    "ext-dev-kit",
    "ext-compression",
    "ext-cors",
    "app-files",
    "doc-render",
    "doc-render-plain",
    "viewer-markdown",
    "viewer-code",
    "viewer-media",
]
entries = ["d-cli", "d-daemon", "d-mcp"]
assemblies = ["d", "d-minimal"]
tools = ["xtask"]
zero_external_deps = [
    "frame",
    "net-api",
    "tls-api",
    "http-api",
    "ws-api",
    "proxy-api",
    "files-api",
    "render-api",
    "ext-observability",
    "ext-ratelimit",
    "ext-auth",
    "ext-cors",
    "doc-render",
    "doc-render-plain",
    "viewer-markdown",
    "viewer-code",
    "viewer-media",
    "d-cli",
    "xtask",
]
minimal_assembly = "d-minimal"
minimal_forbidden = [
    "l4-tls",
    "proto-ws",
    "proto-tcp",
    "ext-proxy",
    "ext-observability",
    "ext-ratelimit",
    "ext-auth",
    "ext-dev-kit",
    "ext-compression",
    "doc-render",
    "viewer-markdown",
    "viewer-code",
    "viewer-media",
    "brotli",
    "flate2",
    "rustls",
    "tokio-rustls",
]
multi_impl_contracts = ["render-api"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
