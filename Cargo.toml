[workspace]
resolver = "2"
members = [
    "crates/frame",
    "crates/contracts/net-api",
    "crates/contracts/tls-api",
    "crates/contracts/http-api",
    "crates/contracts/ws-api",
    "crates/contracts/proxy-api",
    "crates/contracts/files-api",
    "crates/contracts/render-api",
    "crates/components/l4-transport",
    "crates/components/l4-tls",
    "crates/components/proto-http",
    "crates/components/proto-ws",
    "crates/components/proto-tcp",
    "crates/components/ext-proxy",
    "crates/components/ext-observability",
    "crates/components/ext-ratelimit",
    "crates/components/ext-auth",
    "crates/components/ext-dev-kit",
    "crates/components/ext-compression",
    "crates/components/ext-cors",
    "crates/components/app-files",
    "crates/components/doc-render",
    "crates/components/doc-render-plain",
    "crates/components/viewer-markdown",
    "crates/components/viewer-code",
    "crates/components/viewer-media",
    "crates/entries/cli",
    "crates/entries/daemon",
    "crates/entries/mcp",
    "crates/assemblies/d",
    "crates/assemblies/d-minimal",
    "xtask",
]
default-members = [
    "crates/frame",
    "crates/contracts/net-api",
    "crates/contracts/tls-api",
    "crates/contracts/http-api",
    "crates/contracts/ws-api",
    "crates/contracts/proxy-api",
    "crates/contracts/files-api",
    "crates/contracts/render-api",
    "crates/components/l4-transport",
    "crates/components/l4-tls",
    "crates/components/proto-http",
    "crates/components/proto-ws",
    "crates/components/proto-tcp",
    "crates/components/ext-proxy",
    "crates/components/ext-observability",
    "crates/components/ext-ratelimit",
    "crates/components/ext-auth",
    "crates/components/ext-dev-kit",
    "crates/components/ext-compression",
    "crates/components/ext-cors",
    "crates/components/app-files",
    "crates/components/doc-render",
    "crates/components/doc-render-plain",
    "crates/components/viewer-markdown",
    "crates/components/viewer-code",
    "crates/components/viewer-media",
    "crates/entries/cli",
    "crates/entries/daemon",
    "crates/entries/mcp",
    "crates/assemblies/d",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
authors = ["Liu Chong <mail@liuchong.io>"]
repository = "https://github.com/liuchong/d"
license-file = "LICENSE"

[workspace.metadata.architecture]
kernel = ["d-frame"]
contracts = ["d-net-api", "d-tls-api", "d-http-api", "d-ws-api", "d-proxy-api", "d-files-api", "d-render-api"]
components = [
    "d-l4-transport",
    "d-l4-tls",
    "d-proto-http",
    "d-proto-ws",
    "d-proto-tcp",
    "d-ext-proxy",
    "d-ext-observability",
    "d-ext-ratelimit",
    "d-ext-auth",
    "d-ext-dev-kit",
    "d-ext-compression",
    "d-ext-cors",
    "d-app-files",
    "d-doc-render",
    "d-doc-render-plain",
    "d-viewer-markdown",
    "d-viewer-code",
    "d-viewer-media",
]
entries = ["d-cli", "d-daemon", "d-mcp"]
assemblies = ["d", "d-minimal"]
tools = ["xtask"]
zero_external_deps = [
    "d-frame",
    "d-net-api",
    "d-tls-api",
    "d-http-api",
    "d-ws-api",
    "d-proxy-api",
    "d-files-api",
    "d-render-api",
    "d-ext-observability",
    "d-ext-ratelimit",
    "d-ext-auth",
    "d-ext-cors",
    "d-doc-render",
    "d-doc-render-plain",
    "d-viewer-markdown",
    "d-viewer-code",
    "d-viewer-media",
    "d-cli",
    "xtask",
]
minimal_assembly = "d-minimal"
minimal_forbidden = [
    "d-l4-tls",
    "d-proto-ws",
    "d-proto-tcp",
    "d-ext-proxy",
    "d-ext-observability",
    "d-ext-ratelimit",
    "d-ext-auth",
    "d-ext-dev-kit",
    "d-ext-compression",
    "d-doc-render",
    "d-viewer-markdown",
    "d-viewer-code",
    "d-viewer-media",
    "brotli",
    "flate2",
    "rustls",
    "tokio-rustls",
]
multi_impl_contracts = ["d-render-api"]
publish_allowlist = ["d"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
