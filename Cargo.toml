[workspace]
members = [
    ".",
    "crates/frame",
    "crates/contracts/net-api",
    "crates/contracts/http-api",
    "crates/contracts/files-api",
    "crates/contracts/render-api",
    "crates/components/l4-transport",
    "crates/components/proto-http",
    "crates/components/ext-compression",
    "crates/components/ext-cors",
    "crates/components/app-files",
    "crates/components/doc-render",
    "crates/components/viewer-markdown",
    "crates/components/viewer-code",
    "crates/components/viewer-media",
    "crates/entries/cli",
]
default-members = [
    ".",
    "crates/frame",
    "crates/contracts/net-api",
    "crates/contracts/http-api",
    "crates/contracts/files-api",
    "crates/contracts/render-api",
    "crates/components/l4-transport",
    "crates/components/proto-http",
    "crates/components/ext-compression",
    "crates/components/ext-cors",
    "crates/components/app-files",
    "crates/components/doc-render",
    "crates/components/viewer-markdown",
    "crates/components/viewer-code",
    "crates/components/viewer-media",
    "crates/entries/cli",
]

[package]
name = "d"
version = "0.1.0"
authors = ["Liu Chong <mail@liuchong.io>"]
edition = "2024"
rust-version = "1.88"
license-file = "LICENSE"
repository = "https://github.com/liuchong/d"
homepage = "https://github.com/liuchong/d"
documentation = "https://docs.rs/d"
description = "D is a modular extensible network daemon with built-in HTTP and file services."
keywords = ["d", "httpd", "http-server", "http", "server"]

[dependencies]
frame = { path = "crates/frame" }
net-api = { path = "crates/contracts/net-api" }
http-api = { path = "crates/contracts/http-api" }
files-api = { path = "crates/contracts/files-api" }
render-api = { path = "crates/contracts/render-api" }
l4-transport = { path = "crates/components/l4-transport" }
proto-http = { path = "crates/components/proto-http" }
ext-compression = { path = "crates/components/ext-compression" }
ext-cors = { path = "crates/components/ext-cors" }
app-files = { path = "crates/components/app-files" }
doc-render = { path = "crates/components/doc-render" }
viewer-markdown = { path = "crates/components/viewer-markdown" }
viewer-code = { path = "crates/components/viewer-code" }
viewer-media = { path = "crates/components/viewer-media" }
d-cli = { path = "crates/entries/cli" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
