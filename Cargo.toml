[package]
name = "d"
version = "0.1.0"
authors = ["Liu Chong <mail@liuchong.io>"]
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
repository = "https://github.com/liuchong/d"
homepage = "https://github.com/liuchong/d"
documentation = "https://docs.rs/d"
description = "D is a simple standalone httpd."
keywords = ["d", "httpd", "http-server", "http", "server"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal", "net"] }
tokio-util = { version = "0.7", features = ["io"] }

# Web framework
axum = "0.8"
tower-http = { version = "0.6", features = ["compression-gzip", "compression-deflate", "compression-br", "cors"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "2"

# HTTP types
http = "1"
httpdate = "1"

# Utilities
mime_guess = "2"
percent-encoding = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
