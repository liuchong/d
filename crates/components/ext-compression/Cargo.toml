[package]
name = "d-ext-compression"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
description = "Layer 3 streaming-aware response compression extension for d"
publish = false

[dependencies]
frame = { package = "d-frame", path = "../../frame" }
http-api = { package = "d-http-api", path = "../../contracts/http-api" }
flate2 = "1"
brotli = "8"

[dev-dependencies]
proto-http = { package = "d-proto-http", path = "../proto-http" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
