[package]
name = "ext-dev-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license-file = "../../../LICENSE"
description = "Layer 3 development workflow kit: declarative Mocks, zero-CDN Live Reload, and white /_d/inspect UI for d"

[dependencies]
frame = { path = "../../frame" }
http-api = { path = "../../contracts/http-api" }
ws-api = { path = "../../contracts/ws-api" }
tokio = { version = "1", features = ["fs", "sync", "time", "rt", "macros"] }

[dev-dependencies]
l4-transport = { path = "../l4-transport" }
proto-http = { path = "../proto-http" }
proto-ws = { path = "../proto-ws" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
