[package]
name = "d-ext-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
description = "Layer 3 L7/L4 reverse proxy, keep-alive connection pool, load balancer, and health checks for d"

[dependencies]
frame = { package = "d-frame", version = "0.1.1", path = "../../frame" }
net-api = { package = "d-net-api", version = "0.1.1", path = "../../contracts/net-api" }
tls-api = { package = "d-tls-api", version = "0.1.1", path = "../../contracts/tls-api" }
http-api = { package = "d-http-api", version = "0.1.1", path = "../../contracts/http-api" }
proxy-api = { package = "d-proxy-api", version = "0.1.1", path = "../../contracts/proxy-api" }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }

[dev-dependencies]
l4-transport = { package = "d-l4-transport", path = "../l4-transport" }
proto-http = { package = "d-proto-http", path = "../proto-http" }
proto-ws = { package = "d-proto-ws", path = "../proto-ws" }
ws-api = { package = "d-ws-api", path = "../../contracts/ws-api" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
