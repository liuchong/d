[package]
name = "d-proto-tcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
description = "Layer 2 raw TCP and declarative L4 stream forwarding engine for d"
publish = false

[dependencies]
frame = { package = "d-frame", path = "../../frame" }
net-api = { package = "d-net-api", path = "../../contracts/net-api" }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }

[dev-dependencies]
l4-transport = { package = "d-l4-transport", path = "../l4-transport" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
