[package]
name = "proto-tcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license-file = "../../../LICENSE"
description = "Layer 2 raw TCP and declarative L4 stream forwarding engine for d"

[dependencies]
frame = { path = "../../frame" }
net-api = { path = "../../contracts/net-api" }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }

[dev-dependencies]
l4-transport = { path = "../l4-transport" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
