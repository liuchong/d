[package]
name = "d-proto-ws"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
description = "Layer 2 zero-WS-dep pure-Rust RFC 6455 WebSocket engine for d"
publish = false

[dependencies]
frame = { package = "d-frame", path = "../../frame" }
net-api = { package = "d-net-api", path = "../../contracts/net-api" }
http-api = { package = "d-http-api", path = "../../contracts/http-api" }
ws-api = { package = "d-ws-api", path = "../../contracts/ws-api" }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
l4-transport = { package = "d-l4-transport", path = "../l4-transport" }
proto-http = { package = "d-proto-http", path = "../proto-http" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
