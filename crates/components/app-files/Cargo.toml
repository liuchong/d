[package]
name = "d-app-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
description = "Layer 4 file server, sandbox, 301 canonicalization, and directory index for d"

[dependencies]
frame = { package = "d-frame", version = "0.1.1", path = "../../frame" }
http-api = { package = "d-http-api", version = "0.1.1", path = "../../contracts/http-api" }
files-api = { package = "d-files-api", version = "0.1.1", path = "../../contracts/files-api" }
tokio = { version = "1", features = ["fs", "io-util"] }

[dev-dependencies]
proto-http = { package = "d-proto-http", path = "../proto-http" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
