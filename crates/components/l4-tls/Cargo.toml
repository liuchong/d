[package]
name = "l4-tls"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license-file = "../../../LICENSE"
description = "Layer 1 pure-Rust TLS termination, SNI, ALPN, and atomic cert hot-reload for d"

[dependencies]
frame = { path = "../../frame" }
net-api = { path = "../../contracts/net-api" }
tls-api = { path = "../../contracts/tls-api" }
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.14"
l4-transport = { path = "../l4-transport" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
