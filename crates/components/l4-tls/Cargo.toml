[package]
name = "d-l4-tls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
description = "Layer 1 pure-Rust TLS termination, SNI, ALPN, and atomic cert hot-reload for d"
publish = false

[dependencies]
frame = { package = "d-frame", path = "../../frame" }
net-api = { package = "d-net-api", path = "../../contracts/net-api" }
tls-api = { package = "d-tls-api", path = "../../contracts/tls-api" }
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.14"
l4-transport = { package = "d-l4-transport", path = "../l4-transport" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
