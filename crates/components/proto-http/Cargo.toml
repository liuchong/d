[package]
name = "d-proto-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
description = "Layer 2 self-built HTTP/1.1 protocol engine and snapshot router for d"
publish = false

[dependencies]
frame = { package = "d-frame", path = "../../frame" }
net-api = { package = "d-net-api", path = "../../contracts/net-api" }
http-api = { package = "d-http-api", path = "../../contracts/http-api" }
tokio = { version = "1", features = ["sync", "time", "macros"] }

[dev-dependencies]
l4-transport = { package = "d-l4-transport", path = "../l4-transport" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
