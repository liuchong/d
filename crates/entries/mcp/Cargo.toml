[package]
name = "d-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
description = "Optional, configurable pure-Rust MCP control server for dynamic state and config management of d"
publish = false

[dependencies]
frame = { package = "d-frame", path = "../../frame" }
http-api = { package = "d-http-api", path = "../../contracts/http-api" }
d-cli = { path = "../cli" }
d-daemon = { path = "../daemon" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
