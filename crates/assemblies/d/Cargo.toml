[package]
name = "d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
documentation = "https://docs.rs/d"
description = "D is a modular extensible network daemon with built-in HTTP and file services."
keywords = ["d", "httpd", "http-server", "http", "server"]

[features]
default = ["mcp"]
mcp = ["dep:d-mcp"]

[dependencies]
frame = { package = "d-frame", version = "0.1.1", path = "../../frame" }
net-api = { package = "d-net-api", version = "0.1.1", path = "../../contracts/net-api" }
http-api = { package = "d-http-api", version = "0.1.1", path = "../../contracts/http-api" }
files-api = { package = "d-files-api", version = "0.1.1", path = "../../contracts/files-api" }
render-api = { package = "d-render-api", version = "0.1.1", path = "../../contracts/render-api" }
l4-transport = { package = "d-l4-transport", version = "0.1.1", path = "../../components/l4-transport" }
l4-tls = { package = "d-l4-tls", version = "0.1.1", path = "../../components/l4-tls" }
proto-http = { package = "d-proto-http", version = "0.1.1", path = "../../components/proto-http" }
proto-ws = { package = "d-proto-ws", version = "0.1.1", path = "../../components/proto-ws" }
proto-tcp = { package = "d-proto-tcp", version = "0.1.1", path = "../../components/proto-tcp" }
ext-proxy = { package = "d-ext-proxy", version = "0.1.1", path = "../../components/ext-proxy" }
ext-observability = { package = "d-ext-observability", version = "0.1.1", path = "../../components/ext-observability" }
ext-ratelimit = { package = "d-ext-ratelimit", version = "0.1.1", path = "../../components/ext-ratelimit" }
ext-auth = { package = "d-ext-auth", version = "0.1.1", path = "../../components/ext-auth" }
ext-dev-kit = { package = "d-ext-dev-kit", version = "0.1.1", path = "../../components/ext-dev-kit" }
ext-compression = { package = "d-ext-compression", version = "0.1.1", path = "../../components/ext-compression" }
ext-cors = { package = "d-ext-cors", version = "0.1.1", path = "../../components/ext-cors" }
app-files = { package = "d-app-files", version = "0.1.1", path = "../../components/app-files" }
doc-render = { package = "d-doc-render", version = "0.1.1", path = "../../components/doc-render" }
viewer-markdown = { package = "d-viewer-markdown", version = "0.1.1", path = "../../components/viewer-markdown" }
viewer-code = { package = "d-viewer-code", version = "0.1.1", path = "../../components/viewer-code" }
viewer-media = { package = "d-viewer-media", version = "0.1.1", path = "../../components/viewer-media" }
d-cli = { version = "0.1.1", path = "../../entries/cli" }
d-daemon = { version = "0.1.1", path = "../../entries/daemon" }
d-mcp = { version = "0.1.1", path = "../../entries/mcp", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }

[dev-dependencies]
tls-api = { package = "d-tls-api", path = "../../contracts/tls-api" }
ws-api = { package = "d-ws-api", path = "../../contracts/ws-api" }
proxy-api = { package = "d-proxy-api", path = "../../contracts/proxy-api" }
rcgen = "0.14"
tempfile = "3"
